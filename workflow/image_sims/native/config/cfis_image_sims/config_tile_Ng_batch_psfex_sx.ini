# ShapePipe configuration file for tiles: ngmix
#
# No chunking: unlike the real-data design's tile_ngmix (8-way scatter for
# DR6-scale I/O reasons), Gen-2's image-sims dispatch always ran ngmix as
# ONE call over the whole tile (job 1024 = ngmix_runner:1, no split). Kept
# that way here; chunking is a later-phase decision if image-sims tiles
# turn out to need it (they are far smaller than DR6 tiles -- see the port
# plan's Phase-0 measurement).
#
# Forked from shapepipe/example/cfis_image_sims/config_tile_Ng_batch_psfex_sx.ini
# for the native workflow: RUN_DATETIME -> False (see
# config_tile_Git_symlink.ini's header comment for why).


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
RUN_NAME = run_sp_tile_Ng

# Add date and time to RUN_NAME, optional, default: False
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
MODULE = ngmix_runner

# Parallel processing mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# Input directory, containing input files, single string or list of names
INPUT_DIR = .

# Output directory
OUTPUT_DIR = $SP_RUN/output


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 1

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

# Model-fitting shapes with ngmix
[NGMIX_RUNNER]

# Pinned explicitly: leaving this unset triggers ngmix.py's
# pixel_scale_from_wcs() fallback, which crashes on the merged-headers
# store's 'TILE_ID' metadata key ('str' object has no attribute 'values') --
# a real upstream bug in a code path real-data configs never exercise
# (their PIXEL_SCALE is always pinned too, to 0.186). SKiLLS grid sims are
# rendered at 0.185"/px (Cail, fix/imsims-pixel-scale-0.185[-v2]).
PIXEL_SCALE = 0.185

INPUT_DIR = run_sp_tile_Sx:sextractor_runner,run_sp_tile_fpsf:fake_psf_runner,last:vignetmaker_runner_run_2,run_sp_tile_Mh_exp:merge_headers_runner

FILE_PATTERN = sexcat, image_vignet, galaxy_psf, weight_vignet, flag_vignet, log_exp_headers

FILE_EXT = .fits, .sqlite, .sqlite, .sqlite, .sqlite, .sqlite

# NUMBERING_SCHEME (optional) string with numbering pattern for input files
NUMBERING_SCHEME = -000-000

# Magnitude zero-point
MAG_ZP = 30.0

# No background subtraction for image sims (background not simulated)
BKG_SUB = False

SAVE_BATCH = 1000

ID_OBJ_MIN = -1
ID_OBJ_MAX = -1
